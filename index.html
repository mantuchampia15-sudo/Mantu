<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mantu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Hind:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f7f0e1;--surface:#fffaf0;--ink:#2a1630;--mute:#7a6a80;--line:#e6d9c0;--gold:#f2b01e;--rose:#d9446f;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1b0f22;--surface:#27162f;--ink:#f7ecd6;--mute:#a995ad;--line:#3a2744;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Hind,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:9;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font:22px 'Yatra One',Georgia,serif}
.brand svg{width:34px;height:34px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.search{flex:1;min-width:0;border-radius:999px;background:var(--surface)}
.btn{border:0;border-radius:999px;padding:8px 16px;background:var(--gold);color:#2a1630;font-weight:600}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:16px 14px 90px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:none;border:0;padding:0;text-align:left}
.thumb{position:relative;aspect-ratio:16/9;border-radius:4px 28px 4px 28px;overflow:hidden;background:#3a2744}
.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dur{position:absolute;right:10px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:1px 7px;border-radius:99px}
.t{font-weight:600;line-height:1.3;margin:8px 0 0}.s{color:var(--mute);font-size:14px}
.player{border-radius:4px 28px 4px 28px;overflow:hidden;background:#000;aspect-ratio:16/9}.player video{width:100%;height:100%}
.watch{display:grid;gap:14px}.acts{display:flex;gap:8px}
.tag,.badge{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:0 10px;font-size:14px;margin:0 6px 6px 0;background:var(--surface)}.tag{color:var(--rose)}
.desc{background:var(--surface);border-radius:4px 20px 4px 20px;padding:12px 14px;white-space:pre-wrap}
.empty{text-align:center;color:var(--mute);padding:50px 10px}
dialog{border:0;border-radius:6px 28px 6px 28px;background:var(--surface);color:var(--ink);padding:22px;width:min(92vw,420px);max-height:88vh;overflow:auto}
dialog::backdrop{background:rgba(20,8,26,.6)}dialog h2{font:24px 'Yatra One',Georgia,serif;margin:0 0 8px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}textarea{min-height:90px}
.chk{display:flex;gap:10px;align-items:center;font-weight:400}.chk input{width:auto}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.err{color:var(--rose);font-size:14px;min-height:20px;margin-top:6px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 20px rgba(0,0,0,.25);padding:12px 20px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:20}
.link{background:none;border:0;color:var(--rose);padding:0;font-weight:600}
</style>
</head>
<body>
<header>
  <button class="brand" onclick="show('home')" aria-label="Mantu home"><svg viewBox="0 0 40 40" aria-hidden="true"><g fill="#fffaf0" stroke="#d9446f" stroke-width="1.2"><ellipse cx="20" cy="9" rx="5.5" ry="8.5"/><ellipse cx="20" cy="9" rx="5.5" ry="8.5" transform="rotate(72 20 20)"/><ellipse cx="20" cy="9" rx="5.5" ry="8.5" transform="rotate(144 20 20)"/><ellipse cx="20" cy="9" rx="5.5" ry="8.5" transform="rotate(216 20 20)"/><ellipse cx="20" cy="9" rx="5.5" ry="8.5" transform="rotate(288 20 20)"/></g><circle cx="20" cy="20" r="8" fill="#f2b01e"/><path d="M18 16.2v7.6l6.3-3.8z" fill="#2a1630"/></svg><span>Mantu</span></button>
  <input class="search" id="q" type="search" placeholder="Video khojein" aria-label="Search" oninput="render()">
  <span id="auth"></span>
</header>
<main id="main"></main>
<button class="btn fab" onclick="openUpload()">+ Video upload</button>

<dialog id="dAuth">
  <h2 id="aTitle">Login karein</h2>
  <label for="aEmail">Email</label><input type="email" id="aEmail" autocomplete="email">
  <label for="aPass">Password</label><input type="password" id="aPass" autocomplete="current-password">
  <div class="err" id="aErr"></div>
  <div class="row"><button class="btn ghost" onclick="dAuth.close()">Band karein</button><button class="btn" id="aGo" onclick="submitAuth()">Login</button></div>
  <p class="s" style="margin:12px 0 0"><span id="aSwap">Naya account?</span> <button class="link" id="aSwapBtn" onclick="toggleMode()">Sign up</button></p>
</dialog>

<dialog id="dUp">
  <h2>Video upload karein</h2>
  <label for="uFile">Video file (50 MB tak)</label><input type="file" id="uFile" accept="video/*">
  <label for="uTitle">Title</label><input type="text" id="uTitle" maxlength="100">
  <label for="uDesc">Description</label><textarea id="uDesc" maxlength="5000"></textarea>
  <label for="uTags">Tags (comma se alag karein)</label><input type="text" id="uTags" placeholder="vlog, gaon">
  <label for="uCat">Category</label><select id="uCat"><option>Vlog aur Yatra</option><option>Gaane</option><option>Khel</option><option>Comedy</option><option>Shiksha</option><option>Khana aur Recipe</option><option>Tech</option><option selected>Anya</option></select>
  <label for="uLang">Bhasha</label><select id="uLang"><option>Hindi</option><option>Bhojpuri</option><option>English</option><option>Maithili</option><option>Anya</option></select>
  <label for="uLic">License</label><select id="uLic"><option>Standard</option><option>Creative Commons (CC BY)</option></select>
  <label class="chk" style="margin-top:12px"><input type="checkbox" id="uAge">Sirf 18+ ke liye</label>
  <p class="s">Visibility: Private. Video sirf aap dekh sakte hain.</p>
  <div class="err" id="uErr"></div>
  <div class="row"><button class="btn ghost" onclick="dUp.close()">Band karein</button><button class="btn" id="uGo" onclick="publish()">Upload</button></div>
</dialog>

<script>
// ===== Yahan apni 3 values daalein (README dekhein) =====
const SB_URL='https://hmwduacluujxdjsdkhlo.supabase.co', SB_KEY='sb_publishable_p5Mos54S-ybzbBPb-6viTw_ujre1Vr1';
// =========================================================
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let user=null,token='',videos=[],view='home',cur=null,mode='login';
let urls={};const src=v=>urls[v.r2_key]||'';
const fmt=d=>Math.floor(d/60)+':'+String(Math.floor(d%60)).padStart(2,'0');
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
sb.auth.onAuthStateChange((_e,s)=>{user=s?s.user:null;token=s?s.access_token:'';setTimeout(load,0)});
async function load(){videos=[];if(user){const {data,error}=await sb.from('videos').select('*').order('created_at',{ascending:false});if(error)toast(error.message);videos=data||[];if(videos.length){const r=await sb.storage.from('videos').createSignedUrls(videos.map(v=>v.r2_key),43200);(r.data||[]).forEach(o=>{if(o.signedUrl)urls[o.path]=o.signedUrl})}}render()}
function show(v,id){view=v;cur=id||null;if(v==='home')$('q').value='';render();scrollTo(0,0)}
function render(){
 $('auth').innerHTML=user?`<button class="btn ghost" onclick="logout()">Logout</button>`:`<button class="btn" onclick="openAuth('login')">Login</button>`;
 const m=$('main');
 if(!user){m.innerHTML='<div class="empty">Apne video dekhne ke liye pehle login karein.</div>';return}
 if(view==='watch'){const v=videos.find(x=>x.id===cur);if(!v)return show('home');
  m.innerHTML=`<div class="watch"><div class="player"><video src="${src(v)}" controls autoplay playsinline></video></div><h1 class="t" style="font-size:20px">${esc(v.title)}</h1>
  <div>${(v.tags||[]).map(x=>`<span class="tag">#${esc(x)}</span>`).join('')}${[v.category,v.lang,v.license,v.age?'18+':''].filter(Boolean).map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div>
  ${v.description?`<div class="desc">${esc(v.description)}</div>`:''}
  <div class="acts"><button class="btn ghost" onclick="show('home')">Wapas</button><button class="btn ghost" onclick="del('${v.id}')">Delete</button></div></div>`;return}
 const q=$('q').value.trim().toLowerCase();
 const list=videos.filter(v=>!q||v.title.toLowerCase().includes(q)||(v.tags||[]).some(x=>x.toLowerCase().includes(q)));
 m.innerHTML=list.length?`<div class="grid">${list.map(v=>`<button class="card" onclick="show('watch','${v.id}')"><div class="thumb"><video src="${src(v)}#t=0.5" preload="metadata" muted playsinline></video><span class="dur">${esc(v.dur)}</span></div><p class="t">${esc(v.title)}</p><div class="s">${new Date(v.created_at).toLocaleDateString('hi-IN')}</div></button>`).join('')}</div>`:`<div class="empty">${q?'Koi video nahi mila.':'Abhi koi video nahi hai. Neeche se pehla video upload karein.'}</div>`;
}
function openAuth(m){mode=m;setMode();$('aErr').textContent='';dAuth.showModal()}
function toggleMode(){mode=mode==='login'?'signup':'login';setMode()}
function setMode(){const s=mode==='signup';$('aTitle').textContent=s?'Account banayein':'Login karein';$('aGo').textContent=s?'Sign up':'Login';$('aSwap').textContent=s?'Account hai?':'Naya account?';$('aSwapBtn').textContent=s?'Login':'Sign up'}
async function submitAuth(){
 const email=$('aEmail').value.trim(),password=$('aPass').value;
 if(!email||password.length<6)return $('aErr').textContent='Sahi email aur kam se kam 6 akshar ka password daalein.';
 const r=mode==='signup'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
 if(r.error)return $('aErr').textContent=r.error.message;
 dAuth.close();toast(mode==='signup'&&!r.data.session?'Email check karke confirm karein':'Login ho gaya')
}
async function logout(){await sb.auth.signOut()}
function openUpload(){if(!user){toast('Pehle login karein');return openAuth('login')}$('uErr').textContent='';dUp.showModal()}
function publish(){
 const f=$('uFile').files[0],t=$('uTitle').value.trim(),e=$('uErr');
 if(!f)return e.textContent='Video file chunein.';if(!t)return e.textContent='Title likhein.';
 if(f.size>50*1024*1024)return e.textContent='Video 50 MB se chhota rakhein.';
 const key=user.id+'/'+Date.now()+'-'+f.name.replace(/[^\w.-]/g,'_');
 const p=document.createElement('video');p.preload='metadata';p.onloadedmetadata=()=>send(p.duration||0);p.onerror=()=>send(0);p.src=URL.createObjectURL(f);
 async function send(d){$('uGo').disabled=true;e.textContent='Upload ho raha hai. Screen band na karein.';
  const up=await sb.storage.from('videos').upload(key,f,{contentType:f.type||'video/mp4'});
  if(up.error){$('uGo').disabled=false;return e.textContent=up.error.message}
  const {error}=await sb.from('videos').insert({title:t,description:$('uDesc').value.trim(),tags:$('uTags').value.split(',').map(s=>s.trim().replace(/^#/,'')).filter(Boolean).slice(0,15),category:$('uCat').value,lang:$('uLang').value,license:$('uLic').value,age:$('uAge').checked,dur:fmt(d),r2_key:key});
  $('uGo').disabled=false;if(error)return e.textContent=error.message;
  dUp.close();['uFile','uTitle','uDesc','uTags'].forEach(k=>$(k).value='');e.textContent='';toast('Save ho gaya');load()}
}
async function del(id){
 if(!confirm('Yeh video hamesha ke liye hata dein?'))return;
 const v=videos.find(x=>x.id===id);
 await sb.storage.from('videos').remove([v.r2_key]);
 await sb.from('videos').delete().eq('id',id);show('home');load()
}
</script>
</body>
</html>
